<script>
  document.addEventListener('DOMContentLoaded', function() {
    var abToggle = document.getElementById('auto-batch-toggle');
    if (abToggle) {
      abToggle.addEventListener('change', function() {
        var label = document.querySelector('.auto-batch-widget');
        if (!label) return;
        var stateSpan = label.querySelector('.auto-state');
        if (abToggle.checked) {
          label.setAttribute('data-active', 'true');
          if (stateSpan) stateSpan.textContent = 'ACTIVO';
        } else {
          label.setAttribute('data-active', 'false');
          if (stateSpan) stateSpan.textContent = 'INACTIVO';
        }
      });
    }
  });
</script>
